

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- JACK'S PART (Task 1: Setup & Tailwind) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Support Deflection MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- ESTHER'S PART (Task 3: Header & Tabs) -->
    <header class="bg-white shadow">
        <div class="max-w-3xl mx-auto px-4 py-6">
            <h1 class="text-2xl font-bold text-gray-900">Northstar Support Portal</h1>
            <p class="text-sm text-gray-500 mt-1">Self-Serve Support Deflection MVP</p>
        </div>
    </header>

    <div class="max-w-3xl mx-auto w-full px-4 mt-6 flex-grow">
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="flex border-b border-gray-200 cursor-pointer">
                <div id="tab-order" onclick="switchTab('order')" class="flex-1 py-4 text-center font-medium tab-active transition-colors hover:bg-gray-50">Track Order</div>
                <div id="tab-return" onclick="switchTab('return')" class="flex-1 py-4 text-center font-medium tab-inactive transition-colors hover:bg-gray-50">Process Return</div>
            </div>

            <main>
                
                <!--  MARK'S FIRST CODE BLOCK (Task 4)  -->
               
                <div id="section-order" class="p-6 block">
                    <h2 class="text-xl font-semibold mb-4">Where is my order?</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Order ID</label>
                            <input type="text" id="order-id" placeholder="e.g. 12345" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                        </div>
                        <button onclick="checkOrder()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md">Check Status</button>
                    </div>
                    <div id="order-result" class="mt-6 hidden p-4 rounded-md"></div>
                </div>

                <!-- SARAH'S PART (Task 5: Returns Form UI) -->
                <div id="section-return" class="p-6 hidden">
                    <h2 class="text-xl font-semibold mb-4">Return an Item</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Order ID</label>
                            <input type="text" id="return-id" placeholder="e.g. 12345" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Reason</label>
                            <select id="return-reason" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                                <option>Wrong size</option>
                                <option>Item damaged</option>
                            </select>
                        </div>
                        <button onclick="processReturn()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md">Generate Return Label</button>
                    </div>
                    <div id="return-result" class="mt-6 hidden p-4 rounded-md"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- ESTHER'S PART (Task 3: Footer) -->
    <footer class="bg-gray-800 mt-12 py-6">
        <div class="max-w-3xl mx-auto px-4 text-center text-gray-400 text-sm">
            &copy; 2026 Northstar Retail Co. Support Deflection MVP
        </div>
    </footer>

    <script>
        
        // MARK'S SECOND CODE BLOCK (Tasks 6 & 7) 
        function getMockOrderStatus(id) {
            if (id.startsWith('1') || id.startsWith('2')) {
                return { status: `Order <strong>#${id}</strong> has shipped.`, color: 'bg-green-100 text-green-800' };
            }
            return { status: `Order <strong>#${id}</strong> is processing.`, color: 'bg-blue-100 text-blue-800' };
        }

        function getMockRMA() {
            return 'RMA-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        }
        

        // ESTHER'S PART (Tasks 8, 9, 10: UI Logic)
        function switchTab(selectedTab) {
            const tabs = ['order', 'return'];
            tabs.forEach(tab => {
                const tabBtn = document.getElementById(`tab-${tab}`);
                const section = document.getElementById(`section-${tab}`);
                const resultDiv = document.getElementById(`${tab}-result`);
                
                if (tab === selectedTab) {
                    tabBtn.className = 'flex-1 py-4 text-center font-medium tab-active transition-colors hover:bg-gray-50';
                    section.classList.remove('hidden'); section.classList.add('block');
                } else {
                    tabBtn.className = 'flex-1 py-4 text-center font-medium tab-inactive transition-colors hover:bg-gray-50';
                    section.classList.remove('block'); section.classList.add('hidden');
                }
                if(resultDiv) resultDiv.classList.add('hidden');
            });
        }

        function showResult(el, msg, colors) {
            el.innerHTML = msg;
            el.className = `mt-6 p-4 rounded-md ${colors}`;
            el.classList.remove('hidden');
        }

        function checkOrder() {
            const id = document.getElementById('order-id').value.trim();
            const res = document.getElementById('order-result');
            if(!id) return showResult(res, 'Please enter an Order ID.', 'bg-red-100 text-red-700');

            setTimeout(() => {
                const data = getMockOrderStatus(id);
                showResult(res, data.status, data.color);
            }, 400); 
        }

        function processReturn() {
            const id = document.getElementById('return-id').value.trim();
            const res = document.getElementById('return-result');
            if(!id) return showResult(res, 'Please enter an Order ID.', 'bg-red-100 text-red-700');

            setTimeout(() => {
                const rma = getMockRMA();
                showResult(res, `Return approved. Your code is: <strong>${rma}</strong>`, 'bg-green-100 text-green-800');
            }, 400);
        }
    </script>
</body>
                       </html>
